name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate-database:
    name: Banco (Supabase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verificar DATABASE_URL
        id: check
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL nao configurado — pulando migrate/seed"
          fi

      - run: npm ci
        if: steps.check.outputs.configured == 'true'

      - run: npx prisma generate
        if: steps.check.outputs.configured == 'true'

      # Sem seed aqui: em produção ele voltava as senhas para a padrão e podia zerar o mapa.
      - name: Aplicar migrações (com reparo P3009)
        if: steps.check.outputs.configured == 'true'
        run: bash scripts/migrate-deploy.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-backend:
    name: API + Site (Render)
    runs-on: ubuntu-latest
    needs: [migrate-database]
    steps:
      - name: Verificar Deploy Hook
        id: hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render deploy hook obrigatorio
        if: steps.hook.outputs.configured != 'true'
        run: |
          echo "::error::RENDER_DEPLOY_HOOK nao configurado — o Render NAO sera atualizado."
          echo "Configure: docs/CONFIGURAR_DEPLOY_AUTOMATICO.md ou scripts/configurar-render-hook.ps1"
          exit 1

      - name: Disparar redeploy no Render
        if: steps.hook.outputs.configured == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Aguardar API atualizar
        if: steps.hook.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.VITE_API_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          BASE="${API_URL:-https://sigaps-api.onrender.com}"
          BASE="${BASE%/}"
          echo "Aguardando ${BASE}/health reportar commit ${EXPECTED_COMMIT:0:7}..."
          for i in $(seq 1 36); do
            BODY=$(curl -fsS "${BASE}/health" || true)
            COMMIT=$(echo "$BODY" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ -n "$COMMIT" ] && [ "$COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Deploy confirmado: $COMMIT"
              exit 0
            fi
            echo "Tentativa $i/36 — commit atual: ${COMMIT:-desconhecido}"
            sleep 10
          done
          echo "::warning::Render ainda nao reportou o commit esperado apos 6 minutos"
